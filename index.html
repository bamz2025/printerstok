<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="bluetooth=(self)">
  <title>Cetak Label Barang - Thermal Printer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #2c3e50;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      padding: 22px 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.35rem; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }
    .content { padding: 24px 20px; }
    .data-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border-left: 5px solid #3498db;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px dashed #dde;
      font-size: 0.95rem;
    }
    .data-row:last-child { border-bottom: none; }
    .data-row .label { color: #7f8c8d; font-weight: 500; }
    .data-row .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-connect {
      background: #3498db;
      color: white;
    }
    .btn-connect:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }
    .btn-print {
      background: #27ae60;
      color: white;
    }
    .btn-print:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }
    .btn-print-umum {
      background: #8e44ad;
      color: white;
    }
    .btn-close {
      background: #e74c3c;
      color: white;
    }
    #status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 8px;
      border: 2px solid transparent;
    }
    .footer {
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
      color: #95a5a6;
      background: #f8f9fa;
    }

    /* ================= STYLES CETAK UMUM - UKURAN LEBIH KECIL ================= */
    #printArea {
      display: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 5px;
        font-family: Arial, sans-serif;
      }
      .print-label {
        border: 1px solid #000;
        padding: 6px 8px;
        max-width: 180px;
        margin: 0 auto;
        text-align: left;
      }
      .print-title {
        font-size: 11px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 3px;
        text-transform: uppercase;
      }
      .print-line {
        border-bottom: 1px dashed #000;
        margin: 3px 0;
      }
      .print-row {
        font-size: 10px;
        margin: 2px 0;
        line-height: 1.3;
      }
      .print-blank {
        font-size: 10px;
        margin: 3px 0;
      }
      .print-qr {
        margin-top: 4px;
        text-align: center;
      }
      .print-qr img {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Cetak Label Barang</h1>
      <p>LAB TERPADU RSSM</p>
    </div>
    <div class="content">
      <!-- Data yang akan dicetak -->
      <div class="data-card">
        <div class="data-row">
          <span class="label">Nama Barang</span>
          <span class="value" id="nama">-</span>
        </div>
        <div class="data-row">
          <span class="label">Kategori</span>
          <span class="value" id="kategori">-</span>
        </div>
        <div class="data-row">
          <span class="label">Tanggal Masuk</span>
          <span class="value" id="tglMasuk">-</span>
        </div>
        <div class="data-row">
          <span class="label">Tanggal Kadaluarsa</span>
          <span class="value" id="tglExp">-</span>
        </div>
      </div>

      <!-- Tombol -->
      <button class="btn btn-connect" id="btnConnect" onclick="connectPrinter()">
        Sambungkan Printer Bluetooth
      </button>
      <button class="btn btn-print" id="btnPrint" onclick="cetakSekarang()" disabled>
        Cetak Label + QR Code
      </button>
      <button class="btn btn-print-umum" onclick="cetakUmum()">
        Cetak Printer Biasa
      </button>
      <button class="btn btn-close" onclick="window.close()">
        Tutup
      </button>
      <div id="status">Status: Menunggu koneksi printer...</div>
    </div>
    <div class="footer">
      © 2025 Sistem Manajemen Inventaris Barang Lab Terpadu RSSM
    </div>
  </div>

  <!-- AREA CETAK UMUM -->
  <div id="printArea">
    <div class="print-label">
      <div class="print-title">LABEL BARANG</div>
      <div class="print-line"></div>
      <div class="print-row">Nama: <strong id="printNama">-</strong></div>
      <div class="print-row">Kategori: <strong id="printKategori">-</strong></div>
      <div class="print-row">Tgl Masuk: <strong id="printTglMasuk">-</strong></div>
      <div class="print-row">Tgl Exp: <strong id="printTglExp">-</strong></div>
      <div class="print-blank">Tgl Keluar: __________</div>
      <div class="print-line"></div>
      <div class="print-qr">
        <img id="printQrImg" src="" alt="QR Code">
      </div>
    </div>
  </div>

  <script>
    // ================= KONFIGURASI BLUETOOTH =================
    let printerCharacteristic = null;
    const BLUETOOTH_SERVICE_UUID = '000018f0-0000-1000-8000-00805f9b34fb';
    const BLUETOOTH_CHARACTERISTIC_UUID = '00002af1-0000-1000-8000-00805f9b34fb';

    let dataBarang = {
      nama: '-',
      kategori: '-',
      tglMasuk: '-',
      tglExp: '-'
    };

    // ================= AMBIL DATA DARI URL =================
    function ambilDataDariURL() {
      const params = new URLSearchParams(window.location.search);
      
      dataBarang.nama = params.get('nama') || '-';
      dataBarang.kategori = params.get('kategori') || '-';
      dataBarang.tglMasuk = params.get('masuk') || '-';
      dataBarang.tglExp = params.get('exp') || '-';

      document.getElementById('nama').textContent = dataBarang.nama;
      document.getElementById('kategori').textContent = dataBarang.kategori;
      document.getElementById('tglMasuk').textContent = dataBarang.tglMasuk;
      document.getElementById('tglExp').textContent = dataBarang.tglExp;
    }

    // ================= FUNGSI KONEKSI PRINTER =================
    async function connectPrinter() {
      try {
        updateStatus('Mencari perangkat Bluetooth...', '#3498db');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [BLUETOOTH_SERVICE_UUID] }],
          optionalServices: [BLUETOOTH_SERVICE_UUID]
        });
        updateStatus('Menghubungkan ke printer...', '#3498db');
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(BLUETOOTH_SERVICE_UUID);
        printerCharacteristic = await service.getCharacteristic(BLUETOOTH_CHARACTERISTIC_UUID);
        updateStatus('Printer berhasil terhubung!', '#27ae60');
        document.getElementById('btnConnect').disabled = true;
        document.getElementById('btnPrint').disabled = false;
      } catch (error) {
        console.error(error);
        updateStatus('Error: ' + error.message, '#e74c3c');
        printerCharacteristic = null;
        document.getElementById('btnConnect').disabled = false;
        document.getElementById('btnPrint').disabled = true;
      }
    }

    // ================= FUNGSI CETAK THERMAL =================
    async function cetakSekarang() {
      if (!printerCharacteristic) {
        alert('Harap sambungkan printer terlebih dahulu!');
        return;
      }
      try {
        updateStatus('Sedang mencetak...', '#f39c12');
        await printToPrinter(dataBarang);
        updateStatus('Berhasil dicetak!', '#27ae60');
      } catch (err) {
        console.error(err);
        updateStatus('Gagal mencetak: ' + err.message, '#e74c3c');
        alert('Gagal mencetak: ' + err.message);
      }
    }

    async function printToPrinter(data) {
      const nama = data.nama || '-';
      const kategori = data.kategori || '-';
      const tglMasuk = data.tglMasuk || '-';
      const tglExp = data.tglExp || '-';

      const qrData = `${nama}|${kategori}|${tglMasuk}|${tglExp}`;

      // Format dengan titik dua + ukuran lebih kecil
      const commands = [
        '\x1B\x40',                    // Initialize
        '\x1B\x61\x01',                // Center
        '\x1B\x21\x00',                // Normal size
        'LABEL BARANG\n',
        '----------------\n',
        '\x1B\x61\x00',                // Left
        'Nama: ' + nama + '\n',
        'Kategori: ' + kategori + '\n',
        'Tgl Masuk: ' + tglMasuk + '\n',
        'Tgl Exp: ' + tglExp + '\n',
        'Tgl Keluar: ________\n',
        '----------------\n',
        '\x1B\x61\x01',                // Center
        generateQRCodeESC(qrData),
        '\n',
        '\x1B\x64\x02'                 // Feed 2 lines
      ].join('');

      const encoder = new TextEncoder();
      await printerCharacteristic.writeValue(encoder.encode(commands));
    }

    // Generate QR Code ESC/POS (ukuran lebih kecil)
    function generateQRCodeESC(data) {
      const storeLen = data.length + 3;
      const pL = storeLen & 0xFF;
      const pH = (storeLen >> 8) & 0xFF;
      let qr = '';
      // Model 2
      qr += '\x1D\x28\x6B\x04\x00\x31\x41\x32\x00';
      // Size 3 (lebih kecil)
      qr += '\x1D\x28\x6B\x03\x00\x31\x43\x03';
      // Error correction L
      qr += '\x1D\x28\x6B\x03\x00\x31\x45\x30';
      // Store data
      qr += '\x1D\x28\x6B' + String.fromCharCode(pL) + String.fromCharCode(pH) + '\x31\x50\x30' + data;
      // Print
      qr += '\x1D\x28\x6B\x03\x00\x31\x51\x30';
      return qr;
    }

    function updateStatus(message, color) {
      const el = document.getElementById('status');
      el.textContent = 'Status: ' + message;
      el.style.color = color;
      el.style.backgroundColor = color + '18';
      el.style.borderColor = color;
    }

    // ================= FUNGSI CETAK UMUM =================
    function cetakUmum() {
      const qrData = `${dataBarang.nama}|${dataBarang.kategori}|${dataBarang.tglMasuk}|${dataBarang.tglExp}`;

      document.getElementById('printNama').textContent = dataBarang.nama;
      document.getElementById('printKategori').textContent = dataBarang.kategori;
      document.getElementById('printTglMasuk').textContent = dataBarang.tglMasuk;
      document.getElementById('printTglExp').textContent = dataBarang.tglExp;

      const qrImg = document.getElementById('printQrImg');
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=70x70&data=${encodeURIComponent(qrData)}`;

      updateStatus('Membuka dialog cetak umum...', '#8e44ad');
      
      setTimeout(() => {
        window.print();
        updateStatus('Siap cetak', '#27ae60');
      }, 500);
    }

    window.onload = function() {
      ambilDataDariURL();
    };
  </script>
</body>
</html>
